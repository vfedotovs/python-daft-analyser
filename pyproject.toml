[project]
name = "python-daft-analyser"
version = "0.1.0"
description = "Independent tool for personal data analysis of Daft.ie property listings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "playwright>=1.40.0",
    "playwright-stealth>=1.0.6",
]

[project.optional-dependencies]
# S3 upload helper (upload_to_s3.py)
upload = ["boto3>=1.34.0"]
# Test suite
test = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: tests that hit real AWS S3 (deselect with -m 'not integration')",
]
